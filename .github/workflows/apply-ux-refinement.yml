name: Apply UX refinement
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ux_refinement.py'
permissions:
  contents: write
jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[ux-refinement]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/ux_refinement.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx src/StudentOverlay.jsx src/LifecycleOverlay.jsx src/styles.css
          git commit -m 'feat: refine navigation, student notes, and class schedules [ux-refinement]' || exit 0
          git push
      - name: Remove patch script and workflow
        run: |
          git rm scripts/ux_refinement.py .github/workflows/apply-ux-refinement.yml
          git commit -m 'chore: retire UX refinement patch [ux-refinement]'
          git push
