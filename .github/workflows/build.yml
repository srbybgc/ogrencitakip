name: Build

'on':
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[ux-refinement]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply UX refinement
        run: |
          python scripts/ux_refinement.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx src/StudentOverlay.jsx src/LifecycleOverlay.jsx src/styles.css
          git commit -m 'feat: refine navigation, student notes, and class schedules [ux-refinement]'
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
