name: Build

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply pending student import patch
        run: |
          npm install xlsx --save
          node scripts/apply-student-import.mjs
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit generated source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src/App.jsx src/styles.css scripts/apply-student-import.mjs .github/workflows/build.yml
          git commit -m 'feat: enable multi-format student import' || exit 0
          git push origin HEAD:main
