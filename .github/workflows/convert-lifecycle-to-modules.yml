name: Convert lifecycle to normal modules
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Convert navigation and remove overlay
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx'); s=p.read_text(encoding='utf-8')
          s=s.replace("import * as XLSX from 'xlsx'", "import * as XLSX from 'xlsx'\nimport ArchivePage from './ArchivePage'\nimport TrashPage from './TrashPage'")
          old="<button className=\"nav-special\" onClick={() => window.dispatchEvent(new Event('open-archive'))}>Arşiv</button><button className=\"nav-special\" onClick={() => window.dispatchEvent(new Event('open-trash'))}>Çöp Kutusu</button>"
          new="<button className={view === 'archive' ? 'nav-active' : 'nav-special'} onClick={() => { setError(''); setView('archive') }}>Arşiv</button><button className={view === 'trash' ? 'nav-active' : 'nav-special'} onClick={() => { setError(''); setView('trash') }}>Çöp Kutusu</button>"
          if old not in s: raise SystemExit('navigation pattern not found')
          s=s.replace(old,new,1)
          old="{view === 'documents' && <Documents classes={activeClasses} groups={groups} documents={documents} setDocuments={setDocuments} />}"
          new="{view === 'documents' && <Documents classes={activeClasses} groups={groups} documents={documents} setDocuments={setDocuments} />}\n    {view === 'archive' && <ArchivePage />}\n    {view === 'trash' && <TrashPage />}"
          if old not in s: raise SystemExit('view render pattern not found')
          s=s.replace(old,new,1)
          old="{ studentNumber: row.studentNumber, parentPhone: row.parentPhone, secondParentPhone: row.fatherPhone }"
          new="{ studentNumber: row.studentNumber, birthDate: row.birthDate, parentPhone: row.parentPhone, secondParentPhone: row.fatherPhone }"
          if old not in s: raise SystemExit('import details pattern not found')
          s=s.replace(old,new,1)
          old="onArchive={() => window.dispatchEvent(new Event('archive-selected-class'))}"
          new="onArchive={() => { if (selectedClass == null) return; const y = new Date().getFullYear(); setClasses(v => v.map(c => c.id === selectedClass ? { ...c, archivedAt: new Date().toISOString(), academicYear: c.academicYear || `${y}-${y+1}` } : c)); setView('archive') }}"
          if old not in s: raise SystemExit('class archive pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          m=Path('src/main.jsx'); t=m.read_text(encoding='utf-8')
          t=t.replace("import LifecycleOverlay from './LifecycleOverlay'\n","")
          t=t.replace("      <LifecycleOverlay />\n","")
          m.write_text(t,encoding='utf-8')
          PY
          rm -f src/LifecycleOverlay.jsx
          rm -f .github/workflows/fix-student-display.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx src/main.jsx src/LifecycleOverlay.jsx .github/workflows/fix-student-display.yml
          git commit -m 'refactor: make archive and trash first-class modules'
          git push
      - name: Remove migration workflow
        run: |
          git rm .github/workflows/convert-lifecycle-to-modules.yml
          git commit -m 'chore: remove one-shot lifecycle migration workflow'
          git push
