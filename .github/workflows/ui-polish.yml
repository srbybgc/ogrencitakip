name: UI polish
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    if: "!contains(github.event.head_commit.message, '[ui-polish]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI and archive model updates
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/App.jsx'); s=p.read_text()
          s=s.replace("CalendarDays, ChevronLeft,", "ChevronLeft,")
          s=s.replace("const initialClasses = []", "const initialClasses = []\nconst academicYearOptions = (() => { const y = new Date().getFullYear(); return [y-1, y, y+1].map(x => `${x}-${x+1}`) })()")
          s=s.replace("const addClass = (name) => {\n    try { const id = uid(); const next = addClassDomain(classes, name, id);", "const addClass = (name, academicYear) => {\n    try { const id = uid(); const next = addClassDomain(classes, name, id).map(c => c.id === id ? {...c, academicYear} : c);")
          s=s.replace("<nav className=\"desktop-nav\">{[['home','Ana Sayfa'],['classes','Sınıflar'],['groups','Gruplar'],['schedule','Ders Programı'],['documents','Belgeler']].map(([id,label]) => <button key={id} className={view === id ? 'nav-active' : ''} onClick={() => { setError(''); setView(id) }}>{label}</button>)}</nav>", "<nav className=\"desktop-nav\">{[['home','Ana Sayfa'],['classes','Sınıflar'],['groups','Gruplar'],['schedule','Ders Programı'],['documents','Belgeler']].map(([id,label]) => <button key={id} className={view === id ? 'nav-active' : ''} onClick={() => { setError(''); setView(id) }}>{label}</button>)}<button className=\"nav-special\" onClick={() => window.dispatchEvent(new Event('open-archive'))}>Arşiv</button><button className=\"nav-special\" onClick={() => window.dispatchEvent(new Event('open-trash'))}>Çöp Kutusu</button></nav>")
          s=s.replace("onSchedule={() => setView('schedule')} onDocuments={() => setView('documents')} onAdd={() =>", "onAdd={() =>")
          start=s.find('    <div className=\"home-actions\">')
          if start!=-1:
            end=s.find('\n    {groups.length>0', start)
            s=s[:start]+s[end:]
          s=s.replace("function Home({ classes, groups, dayLessons, currentLesson, activeDay, setActiveDay, onClass, onSchedule, onDocuments, onAdd })", "function Home({ classes, groups, dayLessons, currentLesson, activeDay, setActiveDay, onClass, onAdd })")
          s=s.replace("function ClassDetail({ cls, schedule, documents, onBack, onAddStudent, onDeleteStudent, onDeleteClass, onDocument, onImportStudents })", "function ClassDetail({ cls, schedule, documents, onBack, onAddStudent, onDeleteStudent, onDeleteClass, onDocument, onImportStudents, onArchive })")
          s=s.replace("onDeleteClass={deleteClass} documents=", "onDeleteClass={deleteClass} onArchive={() => window.dispatchEvent(new Event('archive-selected-class'))} documents=")
          s=s.replace("<button className=\"danger-outline\" onClick={onDeleteClass}><Trash2 size={16}/> Sınıfı Sil</button>", "<div className=\"detail-actions\"><button className=\"secondary small\" onClick={onArchive}>Sınıfı Arşivle</button><button className=\"danger-outline\" onClick={onDeleteClass}><Trash2 size={16}/> Sınıfı Sil</button></div>")
          old="function ClassModal({onClose,onSave}){const [name,setName]=useState('');return <Modal title=\"Yeni Sınıf\" onClose={onClose}><form onSubmit={e=>{e.preventDefault();onSave(name)}}><Field label=\"Sınıf adı\"><input autoFocus value={name} onChange={e=>setName(e.target.value)} placeholder=\"Örn. 3-A\"/></Field>"
          new="function ClassModal({onClose,onSave}){const [name,setName]=useState('');const [academicYear,setAcademicYear]=useState(academicYearOptions[1]);return <Modal title=\"Yeni Sınıf\" onClose={onClose}><form onSubmit={e=>{e.preventDefault();onSave(name,academicYear)}}><Field label=\"Eğitim öğretim yılı\"><select value={academicYear} onChange={e=>setAcademicYear(e.target.value)}>{academicYearOptions.map(y=><option key={y} value={y}>{y}</option>)}</select></Field><Field label=\"Sınıf adı\"><input autoFocus value={name} onChange={e=>setName(e.target.value)} placeholder=\"Örn. 3-A\"/></Field>"
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('src/LifecycleOverlay.jsx'); s=p.read_text()
          s=s.replace("import { Archive, ArchiveRestore, RotateCcw, Trash2, X } from 'lucide-react'", "import { Archive, ArchiveRestore, RotateCcw, Trash2, X } from 'lucide-react'")
          s=s.replace("const [open,setOpen]=useState(null),[trash,setTrash]=useState", "const [open,setOpen]=useState(null),[trash,setTrash]=useState")
          s=s.replace("useEffect(()=>{const tick=", "useEffect(()=>{const a=()=>setOpen('a'),t=()=>setOpen('t');window.addEventListener('open-archive',a);window.addEventListener('open-trash',t);return()=>{window.removeEventListener('open-archive',a);window.removeEventListener('open-trash',t)}} ,[]);useEffect(()=>{const tick=")
          import re
          s=re.sub(r"<b style=\{s\.sub\}>Aktif sınıflar</b>\{active\.map\(c=>.*?</div>\}\}</div>:", "</div>:", s)
          s=s.replace("const active=read('classes').filter(c=>!c.archivedAt),archived=", "const archived=read('classes').filter(c=>c.archivedAt)")
          s=s.replace("{archived.map(c=><div style={s.row} key={c.id}>", "{Object.entries(archived.reduce((a,c)=>{const y=c.academicYear||'Diğer';(a[y]??=[]).push(c);return a},{})).map(([year,items])=><div key={year}><b style={s.sub}>{year}</b>{items.map(c=><div style={s.row} key={c.id}>")
          s=s.replace("</button></div>)}{!archived.length", "</button></div>)}</div>)}{!archived.length")
          p.write_text(s)

          p=Path('src/styles.css'); s=p.read_text(); s += "\n.nav-special{border:1px solid #e1e6ee!important;background:#fff!important;color:#4f5b6e!important}.nav-special:hover{background:#f0f3f7!important;color:#172033!important}.detail-actions{flex-wrap:wrap}\n"; p.write_text(s)

          p=Path('docs/PROJECT_STATE.md'); s=p.read_text(); s += "\n\n## UI / academic year decisions (2026-09-10)\n- Arşiv ve Çöp Kutusu üst menünün en sağında yer alır; ekranın altına sabit buton konulmaz.\n- Ana sayfadaki Belge/Dosya Ekle ve Ders Programını Yönet alt kartları kaldırıldı; ilgili modüller üst menüden açılır.\n- Arşiv ekranı aktif sınıfları tek tek arşivleme listesi değildir; arşivlenen sınıflar eğitim öğretim yılına göre gruplanır.\n- Sınıf arşivleme işlemi Sınıf Ayarları üzerinden yapılır.\n- Sınıf oluştururken Eğitim Öğretim Yılı seçilir; geçmiş eğitim öğretim yılları değişmeden korunur ve arşiv mantığı yıl bazlıdır.\n- Gelecek yıl eski sınıfların yeni eğitim öğretim yılına aktarılabilmesi ürün gereksinimidir; eski yıl kaydı değişmemelidir.\n"
          p.write_text(s)
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx src/LifecycleOverlay.jsx src/styles.css docs/PROJECT_STATE.md
          git commit -m 'feat: refine archive navigation and academic years [ui-polish]' || exit 0
          git push
      - name: Retire workflow
        if: success()
        run: |
          rm -f .github/workflows/ui-polish.yml
          git add -A
          git commit -m 'chore: retire UI polish workflow [ui-polish]' || true
          git push || true
