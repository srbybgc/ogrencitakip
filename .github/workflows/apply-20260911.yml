name: Apply 2026-09-11 app updates
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply-2026-09-11-updates.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply source changes
        run: python scripts/apply-2026-09-11-updates.py
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          git commit -m 'feat: complete search reports settings and class teacher' || exit 0
          git push
