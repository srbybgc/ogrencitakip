name: Student edit
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[student-edit]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('src/StudentOverlay.jsx'); s=p.read_text()
          s=s.replace("  const [error, setError] = useState('')", "  const [error, setError] = useState('')\n  const [editing, setEditing] = useState(false)\n  const [edit, setEdit] = useState({})")
          s=s.replace("        setError('')\n      }", "        setError('')\n        setEditing(false)\n        setEdit({ ...found })\n      }")
          marker="      <div style={styles.head}>"
          replacement="      <div style={styles.head}>"
          # Replace the information card with an editable version while preserving the read-only view when not editing.
          start=s.find("      <section className=\"card\" style={styles.card}>\n        <div className=\"section-title\">Öğrenci Bilgileri</div>")
          end=s.find("\n\n      <div style={styles.grid}>", start)
          block=s[start:end]
          new="""      <section className=\"card\" style={styles.card}>\n        <div className=\"section-head\"><div className=\"section-title\">Öğrenci Bilgileri</div><button className=\"secondary small\" onClick={()=>{setEditing(v=>!v);setEdit({...student})}}>{editing?'Vazgeç':'Düzenle'}</button></div>\n        {editing ? <div className=\"form-grid\" style={{marginTop:12}}>\n          <label className=\"field\"><span>Ad</span><input value={edit.firstName||''} onChange={e=>setEdit(v=>({...v,firstName:e.target.value}))}/></label>\n          <label className=\"field\"><span>Soyad</span><input value={edit.lastName||''} onChange={e=>setEdit(v=>({...v,lastName:e.target.value}))}/></label>\n          <label className=\"field\"><span>Doğum tarihi</span><input type=\"date\" value={edit.birthDate||''} onChange={e=>setEdit(v=>({...v,birthDate:e.target.value}))}/></label>\n          <label className=\"field\"><span>Cinsiyet</span><select value={edit.gender||''} onChange={e=>setEdit(v=>({...v,gender:e.target.value}))}><option value=\"\">Belirtilmedi</option><option>Kız</option><option>Erkek</option></select></label>\n          <label className=\"field\"><span>Veli adı soyadı</span><input value={edit.parentName||''} onChange={e=>setEdit(v=>({...v,parentName:e.target.value}))}/></label>\n          <label className=\"field\"><span>Veli telefonu</span><input type=\"tel\" value={edit.parentPhone||''} onChange={e=>setEdit(v=>({...v,parentPhone:e.target.value}))}/></label>\n          <label className=\"field\"><span>İkinci veli adı soyadı</span><input value={edit.secondParentName||''} onChange={e=>setEdit(v=>({...v,secondParentName:e.target.value}))}/></label>\n          <label className=\"field\"><span>İkinci veli telefonu</span><input type=\"tel\" value={edit.secondParentPhone||''} onChange={e=>setEdit(v=>({...v,secondParentPhone:e.target.value}))}/></label>\n          <label className=\"field\" style={{gridColumn:'1 / -1'}}><span>Adres</span><textarea value={edit.address||''} onChange={e=>setEdit(v=>({...v,address:e.target.value}))}/></label>\n          <button className=\"primary\" onClick={()=>{if(!edit.firstName?.trim()){setError('Öğrenci adı boş bırakılamaz.');return}const classes=read('ot-classes');const next=classes.map(c=>({...c,students:(c.students||[]).map(x=>x.id===student.id?{...x,...edit,firstName:edit.firstName.trim(),lastName:(edit.lastName||'').trim()}:x)}));write('ot-classes',next);location.reload()}}>Bilgileri Kaydet</button>\n        </div> : <div style={styles.infoGrid}>\n          <div><small>Doğum tarihi</small><b>{student.birthDate ? dateLabel(student.birthDate) : 'Belirtilmedi'}</b></div>\n          <div><small>Cinsiyet</small><b>{student.gender || 'Belirtilmedi'}</b></div>\n          <div><small>Veli</small><b>{student.parentName || 'Belirtilmedi'}</b></div>\n          <div><small>Veli telefonu</small><b>{student.parentPhone || 'Belirtilmedi'}</b></div>\n          <div><small>İkinci veli</small><b>{student.secondParentName || 'Belirtilmedi'}</b></div>\n          <div><small>İkinci veli telefonu</small><b>{student.secondParentPhone || 'Belirtilmedi'}</b></div>\n          <div style={{gridColumn:'1 / -1'}}><small>Adres</small><b>{student.address || 'Belirtilmedi'}</b></div>\n        </div>}\n      </section>"""
          if start<0 or end<0: raise SystemExit('student info block not found')
          s=s[:start]+new+s[end:]
          p.write_text(s)
          p=Path('docs/PROJECT_STATE.md'); s=p.read_text(); s += "\n- Öğrenci detayında mevcut öğrencinin kişisel bilgileri de düzenlenebilir; kaydetme sonrası bilgiler sınıf kaydına işlenir.\n"; p.write_text(s)
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/StudentOverlay.jsx docs/PROJECT_STATE.md
          git commit -m 'feat: allow editing student details [student-edit]' || exit 0
          git push
          rm -f .github/workflows/student-edit.yml
          git add -A
          git commit -m 'chore: retire student edit workflow [student-edit]' || true
          git push || true
