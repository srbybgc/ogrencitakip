name: Student info and safety
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[student-info]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('src/domain.js'); s=p.read_text()
          s=s.replace("export function addStudent(classes, classId, firstName, lastName = '', id = crypto.randomUUID()) {", "export function addStudent(classes, classId, firstName, lastName = '', id = crypto.randomUUID(), details = {}) {")
          s=s.replace("return { ...c, students: sortStudents([...students, { id, firstName: first, lastName: last }]) }", "return { ...c, students: sortStudents([...students, { id, firstName: first, lastName: last, birthDate: details.birthDate || '', gender: details.gender || '', parentName: details.parentName || '', parentPhone: details.parentPhone || '', secondParentName: details.secondParentName || '', secondParentPhone: details.secondParentPhone || '', address: details.address || '' }]) }")
          p.write_text(s)

          p=Path('src/App.jsx'); s=p.read_text()
          s=s.replace("const addStudent = (firstName, lastName) => {", "const addStudent = (firstName, lastName, details = {}) => {")
          s=s.replace("addStudentDomain(classes, selectedClass, firstName, lastName, uid())", "addStudentDomain(classes, selectedClass, firstName, lastName, uid(), details)")
          s=s.replace("const deleteStudent = (sid) => {\n    setClasses(v => deleteStudentDomain(v, selectedClass, sid))", "const deleteStudent = (sid) => {\n    if (!window.confirm('Bu öğrenciyi silmek istediğinizden emin misiniz? Öğrenciye bağlı kayıt ve belgeler de kaldırılacaktır.')) return\n    setClasses(v => deleteStudentDomain(v, selectedClass, sid))")
          s=s.replace("const deleteClass = () => {\n    if (!selectedClass) return", "const deleteClass = () => {\n    if (!selectedClass) return\n    if (!window.confirm('Bu sınıfı silmek istediğinizden emin misiniz? Sınıfa bağlı öğrenciler, dersler ve belgeler de kaldırılacaktır.')) return")
          old="function Home({ classes, groups, dayLessons, currentLesson, activeDay, setActiveDay, onClass, onSchedule, onAdd }) {\n  const orderedClasses = currentLesson ? [...classes].sort((a,b) => Number(b.id === currentLesson.classId) - Number(a.id === currentLesson.classId)) : classes\n  return <main className=\"content\">\n    <div className=\"welcome\"><div><p className=\"eyebrow\">{new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'})}</p><h1>Bugün ne var?</h1><p className=\"muted\">Ders programın ve sınıfların tek bakışta.</p></div>"
          new="function Home({ classes, groups, dayLessons, currentLesson, activeDay, setActiveDay, onClass, onSchedule, onAdd }) {\n  const orderedClasses = currentLesson ? [...classes].sort((a,b) => Number(b.id === currentLesson.classId) - Number(a.id === currentLesson.classId)) : classes\n  const todayLabel = new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'})\n  return <main className=\"content\">\n    <div className=\"welcome\"><div><h1 className=\"home-day-title\">{todayLabel}</h1></div>"
          s=s.replace(old,new)
          old="function StudentModal({onClose,onSave}){const [first,setFirst]=useState('');const [last,setLast]=useState('');return <Modal title=\"Öğrenci Ekle\" onClose={onClose}><form onSubmit={e=>{e.preventDefault();onSave(first,last)}}><Field label=\"Ad\"><input autoFocus value={first} onChange={e=>setFirst(e.target.value)} /></Field><Field label=\"Soyad\"><input value={last} onChange={e=>setLast(e.target.value)} /></Field><div className=\"modal-actions\"><button type=\"button\" className=\"secondary\" onClick={onClose}>Vazgeç</button><button className=\"primary\">Ekle</button></div></form></Modal>}"
          new="function StudentModal({onClose,onSave}){const [first,setFirst]=useState(''),[last,setLast]=useState(''),[birthDate,setBirthDate]=useState(''),[gender,setGender]=useState(''),[parentName,setParentName]=useState(''),[parentPhone,setParentPhone]=useState(''),[secondParentName,setSecondParentName]=useState(''),[secondParentPhone,setSecondParentPhone]=useState(''),[address,setAddress]=useState('');return <Modal title=\"Öğrenci Ekle\" onClose={onClose} wide><form onSubmit={e=>{e.preventDefault();onSave(first,last,{birthDate,gender,parentName,parentPhone,secondParentName,secondParentPhone,address})}}><div className=\"form-grid\"><Field label=\"Ad\"><input autoFocus value={first} onChange={e=>setFirst(e.target.value)} /></Field><Field label=\"Soyad\"><input value={last} onChange={e=>setLast(e.target.value)} /></Field><Field label=\"Doğum tarihi\"><input type=\"date\" value={birthDate} onChange={e=>setBirthDate(e.target.value)} /></Field><Field label=\"Cinsiyet\"><select value={gender} onChange={e=>setGender(e.target.value)}><option value=\"\">Belirtilmedi</option><option value=\"Kız\">Kız</option><option value=\"Erkek\">Erkek</option></select></Field><Field label=\"Veli adı soyadı\"><input value={parentName} onChange={e=>setParentName(e.target.value)} /></Field><Field label=\"Veli telefonu\"><input type=\"tel\" value={parentPhone} onChange={e=>setParentPhone(e.target.value)} /></Field><Field label=\"İkinci veli adı soyadı\"><input value={secondParentName} onChange={e=>setSecondParentName(e.target.value)} /></Field><Field label=\"İkinci veli telefonu\"><input type=\"tel\" value={secondParentPhone} onChange={e=>setSecondParentPhone(e.target.value)} /></Field><Field label=\"Adres\"><textarea value={address} onChange={e=>setAddress(e.target.value)} /></Field></div><div className=\"modal-actions\"><button type=\"button\" className=\"secondary\" onClick={onClose}>Vazgeç</button><button className=\"primary\">Ekle</button></div></form></Modal>}"
          s=s.replace(old,new)
          s=s.replace("const remove=(id)=>{setGroups(v=>deleteGroupDomain(v,id));setError('')}", "const remove=(id)=>{if(!window.confirm('Bu grubu silmek istediğinizden emin misiniz?'))return;setGroups(v=>deleteGroupDomain(v,id));setError('')}")
          s=s.replace("const remove=(id)=>{setSchedule(v=>deleteLessonDomain(v,id));setError('')}", "const remove=(id)=>{if(!window.confirm('Bu dersi programdan silmek istediğinizden emin misiniz?'))return;setSchedule(v=>deleteLessonDomain(v,id));setError('')}")
          s=s.replace("const remove=async d=>{try{", "const remove=async d=>{if(!window.confirm('Bu belgeyi silmek istediğinizden emin misiniz?'))return;try{")
          p.write_text(s)

          p=Path('src/StudentOverlay.jsx'); s=p.read_text()
          s=s.replace("const removeRecord = id => {\n    write('ot-student-records', deleteStudentRecord(read('ot-student-records'), id))", "const removeRecord = id => {\n    if (!window.confirm('Bu kaydı silmek istediğinizden emin misiniz?')) return\n    write('ot-student-records', deleteStudentRecord(read('ot-student-records'), id))")
          marker="      {error && <div className=\"auth-error\" style={{ marginBottom: 12 }}>{error}</div>}\n\n      <div style={styles.grid}>"
          insert="      {error && <div className=\"auth-error\" style={{ marginBottom: 12 }}>{error}</div>}\n\n      <section className=\"card\" style={styles.card}>\n        <div className=\"section-title\">Öğrenci Bilgileri</div>\n        <div style={styles.infoGrid}>\n          <div><small>Doğum tarihi</small><b>{student.birthDate ? dateLabel(student.birthDate) : 'Belirtilmedi'}</b></div>\n          <div><small>Cinsiyet</small><b>{student.gender || 'Belirtilmedi'}</b></div>\n          <div><small>Veli</small><b>{student.parentName || 'Belirtilmedi'}</b></div>\n          <div><small>Veli telefonu</small><b>{student.parentPhone || 'Belirtilmedi'}</b></div>\n          <div><small>İkinci veli</small><b>{student.secondParentName || 'Belirtilmedi'}</b></div>\n          <div><small>İkinci veli telefonu</small><b>{student.secondParentPhone || 'Belirtilmedi'}</b></div>\n          <div style={{gridColumn:'1 / -1'}}><small>Adres</small><b>{student.address || 'Belirtilmedi'}</b></div>\n        </div>\n      </section>\n\n      <div style={styles.grid}>"
          s=s.replace(marker,insert)
          s=s.replace("  grid: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(280px,1fr))', gap: 10 },", "  grid: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(280px,1fr))', gap: 10 },\n  infoGrid: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(180px,1fr))', gap: 10, marginTop: 12 },")
          p.write_text(s)

          p=Path('src/LifecycleOverlay.jsx'); s=p.read_text()
          s=s.replace("onClick={()=>setTrash(v=>v.filter(y=>y.id!==x.id))}", "onClick={()=>{if(window.confirm('Bu kaydı kalıcı olarak silmek istediğinizden emin misiniz?'))setTrash(v=>v.filter(y=>y.id!==x.id))}}")
          s=s.replace("onClick={()=>setTrash([])}", "onClick={()=>{if(window.confirm('Çöp kutusundaki tüm kayıtları kalıcı olarak silmek istediğinizden emin misiniz?'))setTrash([])}}")
          p.write_text(s)

          p=Path('src/styles.css'); s=p.read_text(); s += "\n.home-day-title{font-size:clamp(30px,4vw,44px)!important;margin:0!important;text-transform:capitalize}\n"; p.write_text(s)

          p=Path('docs/PROJECT_STATE.md'); s=p.read_text(); s += "\n- Öğrenci kayıt formu isim-soyisim yanında doğum tarihi, cinsiyet, veli/ikinci veli adı ve telefonları ile adres bilgilerini saklar; toplu aktarımda bu alanlar boş bırakılabilir.\n- Öğrenci, sınıf, grup, ders, belge ve öğrenci geçmişi silmelerinde kullanıcıdan onay alınır; çöp kutusundaki kalıcı silmeler ve çöp kutusunu boşaltma da onay ister.\n- Ana sayfa başlığında gereksiz 'Bugün ne var?' metni kaldırıldı; gün/tarih ana başlık olarak gösterilir ve ders programı aşağıda yer alır.\n"
          p.write_text(s)
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/domain.js src/App.jsx src/StudentOverlay.jsx src/LifecycleOverlay.jsx src/styles.css docs/PROJECT_STATE.md
          git commit -m 'feat: expand student details and confirm destructive actions [student-info]' || exit 0
          git push
          rm -f .github/workflows/student-info-safety.yml
          git add -A
          git commit -m 'chore: retire student info workflow [student-info]' || true
          git push || true
