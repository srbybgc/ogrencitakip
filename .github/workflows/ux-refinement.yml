name: UX refinement
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[ux-refinement]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('src/App.jsx'); s=p.read_text()
          # Home: add search, and make the class-section plus button directly create a class.
          s=s.replace("<Home classes={activeClasses} groups={groups} dayLessons={dayLessons} currentLesson={currentLesson} activeDay={activeDay} setActiveDay={setActiveDay} onClass={goClass} onSchedule={() => setView('schedule')} onAdd={() => { setError(''); setModal('new') }} />", "<Home classes={activeClasses} groups={groups} dayLessons={dayLessons} currentLesson={currentLesson} activeDay={activeDay} setActiveDay={setActiveDay} onClass={goClass} onSchedule={() => setView('schedule')} onAdd={() => { setError(''); setModal('new') }} onAddClass={() => { setError(''); setModal('class') }} search={search} setSearch={setSearch} />")
          s=s.replace("function Home({ classes, groups, dayLessons, currentLesson, activeDay, setActiveDay, onClass, onSchedule, onAdd }) {", "function Home({ classes, groups, dayLessons, currentLesson, activeDay, setActiveDay, onClass, onSchedule, onAdd, onAddClass, search, setSearch }) {")
          s=s.replace("<div className=\"welcome\"><div><h1 className=\"home-day-title\">{todayLabel}</h1></div><button className=\"primary\" onClick={onAdd}><Plus size={18}/> Yeni</button></div>", "<div className=\"welcome\"><div><h1 className=\"home-day-title\">{todayLabel}</h1></div><button className=\"primary\" onClick={onAdd}><Plus size={18}/> Yeni</button></div><div className=\"search home-search\"><Search size={17}/><input value={search} onChange={e=>setSearch(e.target.value)} placeholder=\"Sınıf veya öğrenci ara…\"/></div>")
          s=s.replace("const orderedClasses = currentLesson ? [...classes].sort((a,b) => Number(b.id === currentLesson.classId) - Number(a.id === currentLesson.classId)) : classes", "const filteredClasses = classes.filter(c=>{const q=search.toLocaleLowerCase('tr').trim();return !q||c.name.toLocaleLowerCase('tr').includes(q)||(c.students||[]).some(st=>`${st.firstName} ${st.lastName}`.toLocaleLowerCase('tr').includes(q))}); const orderedClasses = currentLesson ? [...filteredClasses].sort((a,b) => Number(b.id === currentLesson.classId) - Number(a.id === currentLesson.classId)) : filteredClasses")
          s=s.replace("<button className=\"icon-btn\" onClick={onAdd}><Plus size={18}/></button>", "<button className=\"icon-btn\" onClick={onAddClass}><Plus size={18}/></button>", 1)
          # Home schedule should only use teacher lessons; class-program lessons are supporting information.
          s=s.replace("const dayLessons = useMemo(() => schedule.filter(x => x.day === activeDay).sort((a, b) => mins(a.start) - mins(b.start)), [schedule, activeDay])", "const teacherSchedule = useMemo(() => schedule.filter(x => x.scope !== 'classProgram'), [schedule]); const dayLessons = useMemo(() => teacherSchedule.filter(x => x.day === activeDay).sort((a, b) => mins(a.start) - mins(b.start)), [teacherSchedule, activeDay])")
          # Replace ClassDetail with class-program management.
          start=s.find('function ClassDetail('); end=s.find('\nfunction Groups(', start)
          new=r'''function ClassDetail({ cls, schedule, documents, onBack, onAddStudent, onDeleteStudent, onDeleteClass, onDocument, onImportStudents, onArchive, setSchedule, setError }) {
  const [programOpen,setProgramOpen]=useState(false),[day,setDay]=useState(0),[form,setForm]=useState({start:'08:40',end:'09:20',lesson:'',isMyLesson:false})
  if(!cls) return null
  const lessons=schedule.filter(x=>x.classId===cls.id).sort((a,b)=>a.day-b.day||mins(a.start)-mins(b.start))
  const studentDocs=documents.filter(d=>d.targetType==='student'&&cls.students.some(s=>s.id===d.targetId)),classDocs=documents.filter(d=>d.targetType==='class'&&d.targetId===cls.id)
  const addProgramLesson=()=>{try{setSchedule(v=>addLessonDomain(v,{day,start:form.start,end:form.end,classId:cls.id,lesson:form.lesson,scope:'classProgram',isMyLesson:form.isMyLesson},uid()));setForm(v=>({...v,lesson:''}));setError('')}catch(e){setError(errorText(e))}}
  const removeProgramLesson=id=>{if(!window.confirm('Bu ders programı kaydını silmek istediğinizden emin misiniz?'))return;setSchedule(v=>deleteLessonDomain(v,id))}
  return <main className="content"><button className="back-btn" onClick={onBack}><ChevronLeft size={18}/> Sınıflar</button><div className="detail-head"><div><p className="eyebrow">Sınıf</p><h1>{cls.name}</h1><p className="muted">{cls.students.length} öğrenci</p></div><div className="detail-actions"><button className="secondary small" onClick={onArchive}>Sınıfı Arşivle</button><button className="danger-outline" onClick={onDeleteClass}><Trash2 size={16}/> Sınıfı Sil</button></div></div><section className="card"><div className="section-head"><div><div className="section-title"><Users size={18}/> Öğrenciler</div><p className="muted">Öğrenci listesi</p></div><div className="detail-actions"><button className="secondary small" onClick={onImportStudents}><Upload size={16}/> Toplu Aktar</button><button className="primary small" onClick={onAddStudent}><Plus size={16}/> Öğrenci Ekle</button></div></div><div className="student-list">{cls.students.map((s,i)=><div className="student-row" key={s.id}><span className="avatar">{s.firstName[0]}{s.lastName?.[0]||''}</span><span><b>{s.firstName} {s.lastName}</b><small>Öğrenci {i+1}{documents.some(d=>d.targetType==='student'&&d.targetId===s.id)?' · Belgeli':''}</small></span><button className="icon-btn danger" onClick={()=>onDeleteStudent(s.id)}><Trash2 size={16}/></button></div>)}{!cls.students.length&&<div className="empty">Bu sınıfta henüz öğrenci yok.</div>}</div></section><section className="card"><div className="section-head"><div className="section-title"><Clock3 size={18}/> Sınıf Ders Programı</div><button className="primary small" onClick={()=>setProgramOpen(v=>!v)}>{programOpen?'Kapat':'Program Ekle'}</button></div><p className="muted">Bu sınıfın haftalık tüm derslerini burada tut. Sadece “Benim dersim” olarak işaretlenenler öğretmenin ana programında görünür.</p>{programOpen&&<div className="form-grid" style={{marginTop:12}}><Field label="Gün"><select value={day} onChange={e=>setDay(Number(e.target.value))}>{DAYS.map((d,i)=><option key={d} value={i}>{d}</option>)}</select></Field><Field label="Başlangıç"><input type="time" value={form.start} onChange={e=>setForm({...form,start:e.target.value})}/></Field><Field label="Bitiş"><input type="time" value={form.end} onChange={e=>setForm({...form,end:e.target.value})}/></Field><Field label="Ders"><input value={form.lesson} onChange={e=>setForm({...form,lesson:e.target.value})} placeholder="Örn. Resim"/></Field><label className="field"><span>Öğretmen programına dahil et</span><label><input type="checkbox" checked={form.isMyLesson} onChange={e=>setForm({...form,isMyLesson:e.target.checked})}/> Benim dersim</label></label><button className="primary" onClick={addProgramLesson} disabled={!form.lesson.trim()}>Ekle</button></div>}<div className="mini-lessons">{lessons.map(x=><div key={x.id}><b>{DAYS[x.day]}</b><span>{x.start}–{x.end}</span><small>{x.lesson}{x.isMyLesson?' · Benim dersim':''}</small><button className="icon-btn danger" onClick={()=>removeProgramLesson(x.id)}><Trash2 size={16}/></button></div>)}{!lessons.length&&<div className="empty">Bu sınıfa henüz ders programı girilmemiş.</div>}</div></section><section className="card"><div className="section-head"><div className="section-title"><FileText size={18}/> Belgeler</div><button className="link-btn" onClick={onDocument}>Belge Ekle <ChevronRight size={15}/></button></div><p className="muted">{classDocs.length+studentDocs.length} belge bu sınıfla veya öğrencileriyle ilişkili.</p></section></main>
}
'''
          if start<0 or end<0: raise SystemExit('ClassDetail not found')
          s=s[:start]+new+s[end:]
          # Main schedule page becomes display-only teacher timetable.
          start=s.find('function Schedule('); end=s.find('\nfunction Documents(', start)
          new=r'''function Schedule({ classes, schedule, setError }) { const [day,setDay]=useState(todayIndex()); const items=schedule.filter(x=>x.scope!=='classProgram'&&x.day===day).sort((a,b)=>mins(a.start)-mins(b.start)); return <main className="content"><div className="page-head"><div><p className="eyebrow">Haftalık plan</p><h1>Ders Programı</h1><p className="muted">Burada yalnızca senin gireceğin dersler görünür. Bir sınıfın tam programı sınıf sayfasından yönetilir.</p></div></div><div className="day-strip">{DAYS.map((d,i)=><button key={d} className={day===i?'day-chip active':'day-chip'} onClick={()=>setDay(i)}><span>{d.slice(0,3)}</span><b>{dayDate(i).getDate()}</b></button>)}</div><section className="card"><div className="section-head"><div><div className="section-title"><Clock3 size={18}/> {DAYS[day]}</div><p className="muted">{items.length} ders</p></div></div><div className="schedule-manage">{items.map(x=><div key={x.id}><span><b>{x.start}–{x.end}</b><small>{x.lesson} · {classes.find(c=>c.id===x.classId)?.name || 'Silinmiş sınıf'}</small></span></div>)}{!items.length&&<div className="empty">Bu güne henüz sana ait ders eklenmemiş. Sınıfın tam programından kendi dersini işaretleyebilirsin.</div>}</div></section></main> }
'''
          s=s[:start]+new+s[end:]
          # ClassDetail invocation receives setSchedule/setError.
          s=s.replace("<ClassDetail cls={classes.find(c => c.id === selectedClass)} schedule={schedule} onBack", "<ClassDetail cls={classes.find(c => c.id === selectedClass)} schedule={schedule} setSchedule={setSchedule} setError={setError} onBack")
          # Quick create no longer offers a generic lesson entry.
          s=s.replace("<button onClick={onSchedule}><Clock3 size={19}/> Ders ekle<ChevronRight size={17}/></button>", "")
          p.write_text(s)

          p=Path('src/StudentOverlay.jsx'); s=p.read_text()
          # Remove attendance and event; notes only, with starred flag and save timestamp.
          s=s.replace("  const [recordType, setRecordType] = useState('note')\n", "  const [starred, setStarred] = useState(false)\n")
          s=s.replace("setRecordType('note'); setText('');", "setStarred(false); setText('');")
          s=s.replace("setRecordType('note')\n        setText('')", "setStarred(false)\n        setText('')")
          a=s.find("  const addRecord = () => {"); b=s.find("\n  return <div", a)
          replacement=r'''  const addRecord = () => {
    try {
      if (!text.trim()) { setError('Not boş bırakılamaz.'); return }
      const now = new Date().toISOString()
      const record = { studentId: student.id, type: 'note', text: text.trim(), starred, date, createdAt: now, updatedAt: now }
      write('ot-student-records', addStudentRecord(read('ot-student-records'), record, uid()))
      setText(''); setStarred(false); setError(''); setDataVersion(v => v + 1)
    } catch (e) { setError(e instanceof Error ? e.message : 'Not kaydedilemedi.') }
  }
  const saveStudentDetails = () => {
    if (!edit.firstName?.trim()) { setError('Öğrenci adı boş bırakılamaz.'); return }
    const classes = read('ot-classes')
    const next = classes.map(c => ({ ...c, students: (c.students || []).map(x => x.id === student.id ? { ...x, ...edit, firstName: edit.firstName.trim(), lastName: (edit.lastName || '').trim() } : x) }))
    write('ot-classes', next); location.reload()
  }
'''
          # If previous version has no saveStudentDetails, insert it before return; otherwise preserve existing definition.
          if a>=0 and b>=0: s=s[:a]+replacement+s[b:]
          # Replace the attendance + new-record two-card area with a single notes card.
          gs=s.find('      <div style={styles.grid}>'); ge=s.find('\n\n      <section className="card" style={styles.card}>',gs)
          note=r'''      <section className="card" style={styles.card}>
        <div className="section-head"><div><div className="section-title">Not Ekle</div><p className="muted">Öğrenciyle ilgili önemli bilgileri tarihçeye ekle.</p></div><label className="star-note"><input type="checkbox" checked={starred} onChange={e=>setStarred(e.target.checked)}/> ★ Yıldızlı not</label></div>
        <textarea value={text} onChange={e=>setText(e.target.value)} placeholder="Öğrenci hakkında not…" style={styles.textarea} />
        <div className="modal-actions"><label className="field"><span>Tarih</span><input type="date" value={date} onChange={e=>setDate(e.target.value)} /></label><button className="primary" onClick={addRecord}>Notu Kaydet</button></div>
      </section>'''
          if gs>=0 and ge>=0: s=s[:gs]+note+s[ge:]
          s=s.replace("<div style={styles.recordTop}><b>{record.type === 'attendance' ? 'Yoklama' : record.type === 'event' ? 'Olay' : 'Not'}</b><small>{record.date ? dateLabel(record.date) : 'Tarihsiz'}</small></div>", "<div style={styles.recordTop}><b>{record.starred ? '★ ' : ''}Not</b><small>{record.date ? dateLabel(record.date) : 'Tarihsiz'} · Kaydedildi {record.updatedAt ? new Date(record.updatedAt).toLocaleString('tr-TR') : (record.createdAt ? new Date(record.createdAt).toLocaleString('tr-TR') : '')}</small></div>")
          s=s.replace("sort((a, b) => `${b.date || ''}${b.createdAt || ''}`.localeCompare(`${a.date || ''}${a.createdAt || ''}`))", "sort((a, b) => `${b.date || ''}${b.updatedAt || b.createdAt || ''}`.localeCompare(`${a.date || ''}${a.updatedAt || a.createdAt || ''}`))")
          s=s.replace("  const [error, setError] = useState('')\n  const [editing, setEditing]", "  const [error, setError] = useState('')\n  const [editing, setEditing]")
          # Ensure edit state exists if an earlier patch did not leave it.
          if "const [editing, setEditing]" not in s: s=s.replace("const [error, setError] = useState('')", "const [error, setError] = useState('')\n  const [editing, setEditing] = useState(false)\n  const [edit, setEdit] = useState({})")
          # The student info edit UI was already added in the previous revision; keep it.
          p.write_text(s)

          p=Path('src/LifecycleOverlay.jsx'); s=p.read_text()
          # Turn archive/trash overlays into page-like full modules.
          s=s.replace("back:{position:'fixed',inset:0,zIndex:90,background:'rgba(12,20,34,.38)',display:'grid',placeItems:'center',padding:16},panel:{width:'min(760px,100%)',maxHeight:'calc(100vh - 32px)',overflow:'auto',background:'#fff',borderRadius:18,padding:18,boxShadow:'0 24px 80px rgba(10,20,40,.24)'}", "back:{position:'fixed',top:64,left:0,right:0,bottom:0,zIndex:90,background:'#f5f7fb',overflow:'auto'},panel:{width:'100%',minHeight:'100%',background:'#f5f7fb',padding:'28px max(18px,calc((100vw - 1180px)/2))',boxSizing:'border-box'}")
          p.write_text(s)

          p=Path('src/styles.css'); s=p.read_text(); s += "\n.home-search{margin:0 0 14px}.star-note{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700}.star-note input{width:auto}.home-day-title{text-transform:capitalize}\n"; p.write_text(s)

          p=Path('docs/PROJECT_STATE.md'); s=p.read_text(); s += "\n- Ana sayfada sınıf/öğrenci araması bulunur; sınıflar bölümündeki + doğrudan sınıf oluşturur.\n- Öğrenci kartında yalnızca not akışı tutulur; yıldızlı not seçeneği ve notun kaydedilme/güncellenme zamanı vardır, notlar tarihe göre yeniden eskiye sıralanır.\n- Ders Programı ana modülü yalnızca öğretmenin derslerini gösterir. Sınıf detayında haftalık tam sınıf programı girilebilir ve öğretmene ait dersler ayrıca işaretlenebilir.\n- Arşiv ve Çöp Kutusu artık modal kart yerine tam sayfa modül görünümünde açılır.\n"; p.write_text(s)
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx src/StudentOverlay.jsx src/LifecycleOverlay.jsx src/styles.css docs/PROJECT_STATE.md
          git commit -m 'feat: refine navigation, student notes, and class schedules [ux-refinement]' || exit 0
          git push
          rm -f .github/workflows/ux-refinement.yml
          git add -A
          git commit -m 'chore: retire UX refinement workflow [ux-refinement]' || true
          git push || true
