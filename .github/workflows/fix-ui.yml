name: Fix UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[fix-ui]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('src/App.jsx'); s=p.read_text()
          s=s.replace("const goClass = (id) => { setError(''); setSelectedClass(id); setView('class') }", "const goClass = (id) => { setError(''); setSelectedClass(id); window.__otSelectedClass=id; setView('class') }")
          s=s.replace("function Home({ classes, groups, dayLessons, currentLesson, activeDay, setActiveDay, onClass, onAdd })", "function Home({ classes, groups, dayLessons, currentLesson, activeDay, setActiveDay, onClass, onSchedule, onAdd })")
          s=s.replace("currentLesson={currentLesson} activeDay={activeDay}", "currentLesson={currentLesson} activeDay={activeDay}")
          needle="onClass={goClass} onAdd={() => { setError(''); setModal('new') }} />"
          repl="onClass={goClass} onSchedule={() => setView('schedule')} onAdd={() => { setError(''); setModal('new') }} />"
          s=s.replace(needle,repl)
          p.write_text(s)
          p=Path('src/LifecycleOverlay.jsx'); s=p.read_text(); s=s.replace("const archive=id=>", "const archive=id=>")
          p.write_text(s)
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx src/LifecycleOverlay.jsx
          git commit -m 'fix: connect class archive action [fix-ui]' || exit 0
          git push
          rm -f .github/workflows/fix-ui.yml
          git add -A
          git commit -m 'chore: retire fix workflow [fix-ui]' || true
          git push || true
