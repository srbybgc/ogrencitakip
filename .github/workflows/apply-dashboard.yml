name: Apply dashboard migration
'on':
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Migrate
        run: python3 scripts/apply_reference_dashboard.py
      - name: Verify
        run: npm install && npm test && npm run build
      - name: Commit
        run: |
          if grep -q "./ReferenceDashboard" src/App.jsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/App.jsx src/ReferenceDashboard.jsx src/referenceDashboard.css
            if ! git diff --cached --quiet; then git commit -m "feat: apply reference dashboard design"; git push; fi
          fi
