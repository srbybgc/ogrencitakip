      - name: Build
        run: npm ci && npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/pastelTheme.css
          git diff --cached --quiet && exit 0
          git commit -m "feat: apply reference dashboard design"
          git push
      - name: Remove migration workflow
        if: success()
        run: |
          rm -f .github/workflows/apply-reference-dashboard.yml
          git add .github/workflows/apply-reference-dashboard.yml
          git commit -m "chore: remove one-shot dashboard migration" || true
          git push || true
