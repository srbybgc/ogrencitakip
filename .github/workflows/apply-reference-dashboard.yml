p:3px}.note-item p{display:flex;align-items:center;gap:4px;font-size:12px;color:#596d76;margin:5px 0 0}.note-item p svg{fill:#f4bc2e;color:#f4bc2e}.quote-card{margin-top:17px;min-height:152px;background:#dceee3;position:relative;padding:28px 36px;color:#4d9479}.quote-card>span{font:54px Georgia,serif;line-height:20px}.quote-card p{font-size:17px;color:#2f6855;margin:20px 0 0}.quote-leaf{position:absolute;right:52px;bottom:32px;width:22px;height:39px;border-radius:100% 0 100% 0;background:#70aa8b;transform:rotate(25deg)}.quote-leaf:after{content:'';position:absolute;width:3px;height:40px;background:#4f9878;left:10px;top:1px;transform:rotate(20deg);border-radius:3px}
@media(max-width:1100px){.dashboard-grid{grid-template-columns:1fr}.dashboard-side{display:grid;grid-template-columns:1fr 1fr;gap:17px}.quote-card{margin-top:0}.dashboard-main{grid-template-columns:1fr 1fr}.dashboard-class-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){.topbar.sidebar{position:sticky!important;width:100%!important;height:68px!important;flex-direction:row!important;padding:8px 13px!important}.topbar.sidebar .brand{flex:1}.desktop-nav,.sidebar-divider,.sidebar-lower,.sidebar-quote{display:none!important}.main-area{margin-left:0}.workspace-topbar{height:66px;padding:0 13px}.workspace-search{width:min(60vw,400px)}.user-copy,.user-menu>svg{display:none}.content{padding:0 13px 35px!important}.dashboard-main,.bottom-dashboard-row,.dashboard-side{grid-template-columns:1fr}.dashboard-hero{height:170px;padding:0 22px}.dashboard-hero h1{font-size:30px!important}.dashboard-class-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.workspace-search{width:100%;max-width:none}.workspace-user{display:none}.dashboard-hero{height:155px}.dashboard-hero h1{font-size:26px!important}.lesson-item{grid-template-columns:1fr;gap:8px}.lesson-line i:after{display:none}.lesson-item em{justify-self:start}.quick-grid{grid-template-columns:1fr 1fr}.dashboard-class-grid{grid-template-columns:1fr}.bottom-dashboard-row{grid-template-columns:1fr}.dashboard-side{grid-template-columns:1fr}}
