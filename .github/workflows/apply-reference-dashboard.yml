name: Apply reference dashboard design
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'feat: apply reference dashboard design')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite dashboard shell and home
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/App.jsx')
          s = p.read_text()
          s = s.replace("import { ChevronLeft, ChevronRight, Clock3, FileText, FolderOpen, LayoutGrid, Menu, Plus, Search, Trash2, Upload, Users, X } from 'lucide-react'", "import { Archive, Bell, BookOpen, CalendarDays, ChevronDown, ChevronLeft, ChevronRight, Clock3, FileText, FolderOpen, Home as HomeIcon, LayoutGrid, Menu, MoreHorizontal, Plus, Search, Settings, Star, Trash2, Upload, UserRound, Users, UsersRound, X, Zap, Megaphone } from 'lucide-react'")
          start = s.index('  return <div className="app-shell">')
          end = s.index('\nfunction Home(', start)
          shell = r'''  return <div className="app-shell">
    <aside className="topbar sidebar">
      <button className="brand" onClick={() => { setError(''); setView('home') }}>
        <span className="brand-leaf" aria-hidden="true"><span /></span>
        <span><b>Öğrenci Takip</b><small>Daha güzel yarınlar için</small></span>
      </button>
      <nav className="desktop-nav">
        {[['home','Ana Sayfa',HomeIcon],['classes','Öğrenciler',UserRound],['classes','Sınıflar',BookOpen],['schedule','Ders Programı',CalendarDays],['documents','Belgeler',FileText]].map(([id,label,Icon],i) => <button key={`${id}-${i}`} className={view === id ? 'nav-active' : ''} onClick={() => { setError(''); setView(id) }}><Icon size={22}/><span>{label}</span></button>)}
      </nav>
      <div className="sidebar-divider" />
      <nav className="desktop-nav sidebar-lower">
        <button className={view === 'archive' ? 'nav-active' : ''} onClick={() => { setError(''); setView('archive') }}><Archive size={22}/><span>Arşiv</span></button>
        <button className={view === 'trash' ? 'nav-active' : ''} onClick={() => { setError(''); setView('trash') }}><Trash2 size={22}/><span>Çöp Kutusu</span></button>
        <button><Settings size={22}/><span>Ayarlar</span></button>
      </nav>
      <div className="sidebar-quote"><span>“</span><p>Küçük adımlar<br/>büyük değişimler<br/>yaratır.</p><i /></div>
      <button className="icon-btn mobile-menu" onClick={() => setModal('menu')}><Menu size={20} /></button>
    </aside>
    <div className="main-area">
      <header className="workspace-topbar">
        <div className="workspace-search"><Search size={20}/><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Sınıf veya öğrenci ara…"/></div>
        <div className="workspace-user"><button className="notification-btn"><Bell size={22}/><span /></button><button className="user-menu"><span className="user-avatar">SB</span><span className="user-copy"><b>{auth.currentUser?.displayName || 'Serbay Bağcı'}</b></span><ChevronDown size={17}/></button></div>
      </header>
      {error && <div className="content"><Notice message={error} /></div>}
      {view === 'home' && <Home classes={activeClasses} groups={groups} dayLessons={dayLessons} currentLesson={currentLesson} activeDay={activeDay} setActiveDay={setActiveDay} onClass={goClass} onSchedule={() => setView('schedule')} onAdd={() => { setError(''); setModal('new') }} onAddClass={() => { setError(''); setModal('class') }} onNewStudent={() => setView('classes')} onDocument={() => setView('documents')} search={search} setSearch={setSearch} />}
      {view === 'classes' && <Classes classes={visibleClasses} search={search} setSearch={setSearch} onClass={goClass} onAdd={() => setModal('class')} />}
      {view === 'class-schedule' && <ClassSchedulePage cls={classes.find(c => c.id === selectedClass)} schedule={schedule} setSchedule={setSchedule} setError={setError} onBack={() => setView('class')} />}
      {view === 'class' && <ClassDetail cls={classes.find(c => c.id === selectedClass)} schedule={schedule} setSchedule={setSchedule} setError={setError} onBack={() => setView('classes')} onAddStudent={() => setModal('student')} onDeleteStudent={deleteStudent} onDeleteClass={deleteClass} onArchive={() => { if (selectedClass == null) return; const y = new Date().getFullYear(); setClasses(v => v.map(c => c.id === selectedClass ? { ...c, archivedAt: new Date().toISOString(), academicYear: c.academicYear || `${y}-${y+1}` } : c)); setView('archive') }} documents={documents} onDocument={() => setView('documents')} onImportStudents={() => setModal('import-students')} onProgram={() => setView('class-schedule')} />}
      {view === 'groups' && <Groups classes={activeClasses} groups={groups} setGroups={setGroups} setError={setError} />}
      {view === 'schedule' && <Schedule classes={activeClasses} schedule={schedule} setSchedule={setSchedule} setError={setError} />}
      {view === 'documents' && <Documents classes={activeClasses} groups={groups} documents={documents} setDocuments={setDocuments} />}
      {view === 'archive' && <ArchivePage />}
      {view === 'trash' && <TrashPage />}
      {modal === 'class' && <ClassModal onClose={() => setModal(null)} onSave={addClass} />}
      {modal === 'student' && <StudentModal onClose={() => setModal(null)} onSave={addStudent} />}
      {modal === 'import-students' && <StudentImportModal onClose={() => setModal(null)} onImport={importStudents} />}
      {modal === 'new' && <QuickModal onClose={() => setModal(null)} onClass={() => setModal('class')} onSchedule={() => { setModal(null); setView('schedule') }} onDocument={() => { setModal(null); setView('documents') }} />}
      {modal === 'menu' && <Modal title="Menü" onClose={() => setModal(null)}><div className="menu-list">{[['home','Ana Sayfa'],['classes','Sınıflar'],['groups','Gruplar'],['schedule','Ders Programı'],['documents','Belgeler'],['archive','Arşiv'],['trash','Çöp Kutusu']].map(([id,label]) => <button key={id} onClick={() => { setView(id); setModal(null) }}>{label}<ChevronRight size={17} /></button>)}</div></Modal>}
    </div>
  </div>
}'''
          s = s[:start] + shell + s[end:]
          start = s.index('function Home(')
          end = s.index('\nfunction Classes(', start)
          home = r'''function Home({ classes, groups, dayLessons, currentLesson, activeDay, setActiveDay, onClass, onSchedule, onAdd, onAddClass, onNewStudent, onDocument, search, setSearch }) {
  const filteredClasses = classes.filter(c=>{const q=search.toLocaleLowerCase('tr').trim();return !q||c.name.toLocaleLowerCase('tr').includes(q)||(c.students||[]).some(st=>`${st.firstName} ${st.lastName}`.toLocaleLowerCase('tr').includes(q))})
  const orderedClasses = currentLesson ? [...filteredClasses].sort((a,b) => Number(b.id === currentLesson.classId) - Number(a.id === currentLesson.classId)) : filteredClasses
  const now = new Date()
  const todayLabel = now.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'})
  const [calMonth,setCalMonth] = useState(new Date(now.getFullYear(),now.getMonth(),1))
  const year=calMonth.getFullYear(), month=calMonth.getMonth(), first=new Date(year,month,1), days=new Date(year,month+1,0).getDate(), lead=(first.getDay()+6)%7
  const calCells=Array.from({length:lead+days},(_,i)=>i<lead?null:i-lead+1)
  const monthName=calMonth.toLocaleDateString('tr-TR',{month:'long',year:'numeric'})
  const upcoming = dayLessons.slice(0,3)
  const latestDocs = [...documentsForHome()].slice(0,3)
  function documentsForHome(){ try{return JSON.parse(localStorage.getItem('ot-documents')||'[]')}catch{return []} }
  const noteItems = classes.flatMap(c=>(c.students||[]).map(s=>({student:`${s.firstName} ${s.lastName}`,className:c.name,initial:`${s.firstName?.[0]||''}${s.lastName?.[0]||''}`,time:'Bugün',text:s.note||s.notes||''}))).filter(x=>x.text).slice(0,3)
  return <main className="content dashboard-content">
    <section className="dashboard-hero"><div><p>İyi bir gün olsun <span>🌿</span></p><h1>{todayLabel}</h1><small>Bugün de harika işler başaracaksın.</small></div><div className="hero-leaves"><i/><i/><i/><i/><i/></div></section>
    <div className="dashboard-grid">
      <div className="dashboard-main">
        <section className="dash-card lessons-card"><div className="dash-head"><div><h2><CalendarDays size={22}/> Bugünün Dersleri</h2></div><button className="dash-link" onClick={onSchedule}>Tümünü Gör <ChevronRight size={17}/></button></div>
          <div className="lesson-timeline">{upcoming.length?upcoming.map((x,i)=><button className={`lesson-item ${isNow(x)?'lesson-now':''}`} key={x.id} onClick={()=>onClass(x.classId)}><span className="lesson-line"><i/><b>{x.start} – {x.end}</b></span><span className="lesson-kind"><span className="lesson-icon"><UsersRound size={22}/></span><span><strong>{classes.find(c=>c.id===x.classId)?.name||'—'}</strong><small>{x.lesson}</small></span></span><em>{isNow(x)?'Şimdi':i===1?'Yaklaşıyor':''}</em></button>):<div className="dash-empty">Bugün için ders bulunmuyor.</div>}</div>
        </section>
        <section className="dash-card quick-card"><div className="dash-head"><h2><Zap size={22}/> Hızlı İşlemler</h2></div><div className="quick-grid"><button onClick={onNewStudent}><UserRound size={26}/><span>Yeni Öğrenci</span></button><button onClick={onAddClass}><UsersRound size={26}/><span>Sınıf Ekle</span></button><button onClick={onDocument}><FileText size={26}/><span>Belge Ekle</span></button><button onClick={onSchedule}><CalendarDays size={26}/><span>Ders Programı</span></button></div></section>
        <section className="dash-card classes-card"><div className="dash-head"><h2><UsersRound size={22}/> Sınıflarım</h2><div className="head-right"><button className="dash-link">Tümünü Gör <ChevronRight size={17}/></button><button className="circle-add" onClick={onAddClass}><Plus size={21}/></button></div></div><div className="dashboard-class-grid">{orderedClasses.slice(0,4).map((c,i)=><button key={c.id} className={`dashboard-class c${i}`} onClick={()=>onClass(c.id)}><span className="dash-class-icon"><UsersRound size={23}/></span><span><b>{c.name}</b><small>{c.students.length} öğrenci</small></span></button>)}{!orderedClasses.length&&<div className="dash-empty">Henüz sınıf oluşturulmadı.</div>}</div></section>
        <div className="bottom-dashboard-row"><section className="dash-card docs-card"><div className="dash-head"><h2><FileText size={22}/> Son Eklenen Belgeler</h2><button className="dash-link" onClick={onDocument}>Tümünü Gör <ChevronRight size={17}/></button></div><div className="doc-mini-list">{latestDocs.length?latestDocs.map(d=><div className="doc-mini" key={d.id}><span className="doc-type">{String(d.type||'').includes('pdf')?'PDF':String(d.name||'').split('.').pop()?.toUpperCase()||'DOC'}</span><span><b>{d.name}</b><small>{d.targetType==='class'?'4-D':d.targetType==='group'?'Genel':'Öğrenci'} · {d.createdAt?new Date(d.createdAt).toLocaleDateString('tr-TR',{day:'numeric',month:'short'}):'Bugün'} · {d.size?((d.size/1024/1024).toFixed(1)+' MB'):''}</small></span><MoreHorizontal size={18}/></div>):<div className="dash-empty">Henüz belge yüklenmedi.</div>}</div></section>
          <section className="dash-card announcements-card"><div className="dash-head"><h2><Megaphone size={22}/> Duyurular</h2><button className="dash-link">Tümünü Gör <ChevronRight size={17}/></button></div><div className="announcement"><i/><div><b>Resim Sergisi</b><small>12 Eylül 2025</small><p>Öğrencilerimizin yıl boyunca hazırladığı çalışmalar sergilenecektir.</p></div></div><div className="announcement"><i/><div><b>Veli Toplantısı</b><small>18 Eylül 2025</small><p>Tüm velilerimiz davetlidir.</p></div></div></section></div>
      </div>
      <aside className="dashboard-side">
        <section className="dash-card calendar-card"><div className="dash-head"><h2><CalendarDays size={22}/> Takvim</h2><button className="today-btn" onClick={()=>setCalMonth(new Date(now.getFullYear(),now.getMonth(),1))}>Bugün</button><button className="cal-arrow" onClick={()=>setCalMonth(new Date(year,month-1,1))}><ChevronLeft size={18}/></button><button className="cal-arrow" onClick={()=>setCalMonth(new Date(year,month+1,1))}><ChevronRight size={18}/></button></div><h3>{monthName}</h3><div className="calendar-week">{['Pzt','Sal','Çar','Per','Cum','Cts','Paz'].map(x=><span key={x}>{x}</span>)}</div><div className="calendar-grid">{calCells.map((d,i)=><span key={i} className={d===now.getDate()&&month===now.getMonth()&&year===now.getFullYear()?'today-date':''}>{d||''}</span>)}</div></section>
        <section className="dash-card notes-card"><div className="dash-head"><h2><FileText size={22}/> Son Notlar</h2><button className="dash-link">Tümünü Gör <ChevronRight size={17}/></button></div>{noteItems.length?noteItems.map(n=><div className="note-item" key={n.student+n.time}><span className="note-avatar"><UserRound size={22}/></span><div><b>{n.student}</b><small>{n.className} · {n.time}</small><p><Star size={14}/>{n.text}</p></div><ChevronRight size={17}/></div>):<div className="note-item"><span className="note-avatar"><UserRound size={22}/></span><div><b>Henüz not yok</b><small>Öğrenci notları burada görünecek.</small></div></div>}</section>
        <section className="quote-card"><span>“</span><p>Her çocuk özeldir.</p><i className="quote-leaf"/></section>
      </aside>
    </div>
  </main>
}'''
          s = s[:start] + home + s[end:]
          p.write_text(s)
          PY
      - name: Apply reference theme
        shell: bash
        run: |
          cat >> src/pastelTheme.css <<'CSS'

/* Reference dashboard design — 1536x1024 composition */
:root{--ref-bg:#f3f8f5;--ref-panel:#fff;--ref-ink:#122b3a;--ref-muted:#61727b;--ref-green:#3f9477;--ref-green-2:#2f7b61;--ref-line:#e3ece7;--ref-blue:#2876c9;--ref-blue-bg:#eef5ff;--ref-peach:#fff2e8;--ref-lilac:#f1efff}
body{background:#f3f8f5!important;color:var(--ref-ink)!important}
.topbar.sidebar{width:246px!important;padding:19px 16px 24px!important;background:linear-gradient(180deg,#edf7f1 0%,#f0f8f3 100%)!important;border-right:1px solid #dce9e2!important;box-shadow:none!important;gap:20px!important}
.brand{padding:0 13px!important;min-height:57px}.brand-mark{display:none!important}.brand-leaf{position:relative;width:42px;height:42px;display:block;transform:rotate(-15deg)}.brand-leaf:before,.brand-leaf:after,.brand-leaf span{content:'';position:absolute;border:3px solid #4e9879;border-radius:100% 0 100% 0;width:24px;height:31px;transform:rotate(35deg);left:3px;top:2px}.brand-leaf:after{width:18px;height:25px;left:15px;top:11px;transform:rotate(72deg)}.brand-leaf span{width:3px;height:36px;border:0;border-radius:4px;background:#4e9879;left:20px;top:4px;transform:rotate(26deg)}.brand b{font-size:18px!important;color:#112d39!important}.brand small{font-size:11px!important;color:#6f817b!important}
.desktop-nav{gap:4px!important}.desktop-nav button{height:51px!important;padding:0 15px!important;border-radius:11px!important;font-size:15px!important;font-weight:650!important;color:#173743!important;gap:18px!important}.desktop-nav button:before{display:none!important}.desktop-nav button svg{stroke-width:1.8}.desktop-nav button:hover,.desktop-nav .nav-active{background:#dcefe4!important;color:#0e5847!important;border:0!important}.desktop-nav .nav-active svg{stroke-width:2.2}.sidebar-divider{height:1px;background:#d5e4dd;margin:1px 10px 1px}.sidebar-lower{gap:3px!important}.sidebar-lower button{height:51px!important}.sidebar-quote{margin-top:auto;padding:8px 18px 0;position:relative;color:#214b40}.sidebar-quote span{font-size:58px;line-height:28px;color:#73ae91;font-family:Georgia,serif}.sidebar-quote p{font-size:14px;line-height:1.55;margin:6px 0 14px}.sidebar-quote i{display:block;width:42px;height:2px;background:#72a990}
.main-area{margin-left:246px;min-height:100vh}.workspace-topbar{height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 29px 0 27px;background:rgba(243,248,245,.96);position:sticky;top:0;z-index:19}.workspace-search{width:455px;height:45px;background:#fff;border:1px solid #e1ebe6;border-radius:24px;display:flex;align-items:center;gap:12px;padding:0 17px;color:#183946;box-shadow:0 3px 15px rgba(47,91,72,.035)}.workspace-search input{border:0;outline:0;background:transparent;flex:1;font-size:14px;color:var(--ref-ink)}.workspace-search input::placeholder{color:#6d777d}.workspace-user{display:flex;align-items:center;gap:18px}.notification-btn{position:relative;border:0;background:transparent;padding:8px;color:#123541}.notification-btn span{position:absolute;right:4px;top:4px;width:8px;height:8px;border-radius:50%;background:#db4f50;border:1px solid #fff}.user-menu{border:0;background:transparent;display:flex;align-items:center;gap:11px;color:#16333e}.user-avatar{width:47px;height:47px;border-radius:50%;display:grid;place-items:center;background:#4a987d;color:#fff;font-size:14px}.user-copy b{font-size:13px}.content{margin-left:0!important;width:auto!important;max-width:none!important;padding:0 27px 45px!important}.dashboard-content{padding-top:0!important}.dashboard-hero{height:186px;border:1px solid #e3eee8;border-radius:18px;background:linear-gradient(112deg,#fbfffd 0%,#eef8f1 62%,#e4f2e7 100%);position:relative;overflow:hidden;display:flex;align-items:center;padding:0 34px;margin-bottom:17px}.dashboard-hero p{font-size:15px;margin:0 0 7px;color:#2b4d43}.dashboard-hero p span{font-size:19px}.dashboard-hero h1{font-size:37px!important;line-height:1.08!important;letter-spacing:-.035em!important;color:#0e2837!important;margin:0 0 9px!important}.dashboard-hero small{font-size:15px;color:#274c42}.hero-leaves{position:absolute;right:-7px;bottom:-27px;width:330px;height:190px}.hero-leaves:before{content:'';position:absolute;right:100px;bottom:-6px;width:8px;height:188px;border-radius:100%;background:#7cb394;transform:rotate(10deg)}.hero-leaves i{position:absolute;width:46px;height:80px;border-radius:100% 0 100% 0;background:#77ad8f;transform:rotate(35deg)}.hero-leaves i:nth-child(1){right:67px;bottom:90px}.hero-leaves i:nth-child(2){right:7px;bottom:48px;transform:rotate(70deg);background:#65a184}.hero-leaves i:nth-child(3){right:110px;bottom:32px;transform:rotate(14deg);background:#9bc9aa}.hero-leaves i:nth-child(4){right:18px;bottom:117px;transform:rotate(10deg);background:#a6d1b2}.hero-leaves i:nth-child(5){right:145px;bottom:104px;transform:rotate(-27deg);background:#d8eac9;width:52px;height:66px}
.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(330px,.85fr);gap:17px}.dashboard-main{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(300px,.88fr);gap:17px;align-items:start}.dash-card,.quote-card{background:rgba(255,255,255,.96);border:1px solid #e1ebe6;border-radius:17px;box-shadow:0 5px 20px rgba(43,82,66,.045);overflow:hidden}.dash-card{padding:20px}.dash-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.dash-head h2{display:flex;align-items:center;gap:10px;font-size:17px;margin:0;color:#102d3a}.dash-head h2 svg{color:#163e4b;stroke-width:2}.dash-link{border:0;background:none;color:#21705b;font-size:13px;font-weight:700;display:flex;align-items:center;gap:3px;padding:4px}.lessons-card{min-height:258px}.lesson-timeline{display:grid;gap:0}.lesson-item{position:relative;border:0;border-bottom:1px solid #edf1ef;background:transparent;width:100%;display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:6px;padding:11px 0;text-align:left;color:#15343f}.lesson-item:last-child{border-bottom:0}.lesson-line{display:flex;align-items:center;gap:12px}.lesson-line i{width:13px;height:13px;border-radius:50%;background:#4d9d7c;box-shadow:0 0 0 4px #e3f2ea;position:relative}.lesson-line i:after{content:'';position:absolute;left:5px;top:15px;width:2px;height:42px;background:#cfe4d9}.lesson-item:last-child .lesson-line i:after{display:none}.lesson-line b{font-size:13px;font-weight:500;color:#245075}.lesson-kind{display:flex;align-items:center;gap:11px}.lesson-icon{width:43px;height:43px;border-radius:11px;background:#edf5ff;color:#2879cb;display:grid;place-items:center}.lesson-kind strong,.lesson-kind small{display:block}.lesson-kind strong{font-size:16px}.lesson-kind small{font-size:12px;color:#687c84;margin-top:3px}.lesson-item em{font-style:normal;font-size:12px;color:#1f6f5a;background:#e5f5ed;padding:9px 13px;border-radius:12px}.lesson-now em{background:#ddf2e9}.quick-card{min-height:258px}.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.quick-grid button{height:93px;border:0;border-radius:13px;background:#edf8f3;color:#0c5b48;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 18px;gap:10px;text-align:left}.quick-grid button:nth-child(2),.quick-grid button:nth-child(4){background:#eef4ff;color:#0b4f8c}.quick-grid svg{stroke-width:1.8}.quick-grid span{font-size:14px;color:#153842}.classes-card{grid-column:1/-1}.head-right{display:flex;align-items:center;gap:13px}.circle-add{width:42px;height:42px;border:0;border-radius:50%;background:#4b997b;color:#fff;display:grid;place-items:center}.dashboard-class-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.dashboard-class{border:0;border-radius:13px;min-height:80px;display:flex;align-items:center;gap:12px;padding:12px;text-align:left}.dashboard-class.c0,.dashboard-class.c1{background:#eaf8f2}.dashboard-class.c2{background:#fff0e6}.dashboard-class.c3{background:#f0efff}.dash-class-icon{width:39px;height:39px;border-radius:11px;background:rgba(255,255,255,.45);display:grid;place-items:center;color:#13855f}.dashboard-class.c2 .dash-class-icon{color:#e7792f}.dashboard-class.c3 .dash-class-icon{color:#2f61d3}.dashboard-class b,.dashboard-class small{display:block}.dashboard-class b{font-size:16px}.dashboard-class small{font-size:12px;color:#65777f;margin-top:4px}.bottom-dashboard-row{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:17px}.docs-card,.announcements-card{min-height:245px}.doc-mini{display:grid;grid-template-columns:43px 1fr 18px;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #edf1ef}.doc-mini:last-child{border-bottom:0}.doc-type{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:#ffddd8;color:#d94237;font-size:9px;font-weight:800}.doc-mini:nth-child(2) .doc-type{background:#dfeeff;color:#2675c5}.doc-mini:nth-child(3) .doc-type{background:#d9f4e5;color:#2