name: Complete student import
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/PROJECT_STATE.md'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install parser
        run: npm install xlsx --save
      - name: Apply complete import and duplicate-class fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx'); s=p.read_text()
          if "import * as XLSX from 'xlsx'" not in s:
              s=s.replace("import { useEffect, useMemo, useState } from 'react'", "import { useEffect, useMemo, useState } from 'react'\nimport * as XLSX from 'xlsx'", 1)
          start=s.index('  const addClass = (name) => {')
          end=s.index('  const deleteStudent = (sid) => {')
          handlers="""  const addClass = (name) => {
            try {
              const id = uid()
              const next = addClassDomain(classes, name, id)
              setClasses(next)
              setModal(null)
              goClass(id)
            } catch (e) { setError(errorText(e)) }
          }
          const addStudent = (firstName, lastName) => {
            if (selectedClass == null) return
            try {
              const next = addStudentDomain(classes, selectedClass, firstName, lastName, uid())
              setClasses(next)
              setModal(null)
              setError('')
            } catch (e) { setError(errorText(e)) }
          }
          const importStudents = (rows) => {
            if (selectedClass == null) return
            let next = classes, added = 0, skipped = 0
            rows.forEach(row => {
              try {
                next = addStudentDomain(next, selectedClass, row.firstName, row.lastName, uid())
                added += 1
              } catch { skipped += 1 }
            })
            setClasses(next)
            setModal(null)
            setError(skipped ? `${added} öğrenci aktarıldı, ${skipped} satır atlandı (boş/tekrar).` : `${added} öğrenci aktarıldı.`)
          }
"""
          s=s[:start]+handlers+s[end:]
          s=s.replace("documents={documents} onDocument={() => setView('documents')} />}", "documents={documents} onDocument={() => setView('documents')} onImportStudents={() => setModal('import-students')} />}", 1)
          s=s.replace("{modal === 'student' && <StudentModal onClose={() => setModal(null)} onSave={addStudent} />}", "{modal === 'student' && <StudentModal onClose={() => setModal(null)} onSave={addStudent} />}\n    {modal === 'import-students' && <StudentImportModal onClose={() => setModal(null)} onImport={importStudents} />}", 1)
          s=s.replace("function ClassDetail({ cls, schedule, documents, onBack, onAddStudent, onDeleteStudent, onDeleteClass, onDocument })", "function ClassDetail({ cls, schedule, documents, onBack, onAddStudent, onDeleteStudent, onDeleteClass, onDocument, onImportStudents })", 1)
          old='<button className="primary small" onClick={onAddStudent}><Plus size={16}/> Öğrenci Ekle</button>'
          new='<div className="detail-actions"><button className="secondary small" onClick={onImportStudents}><Upload size={16}/> Toplu Aktar</button><button className="primary small" onClick={onAddStudent}><Plus size={16}/> Öğrenci Ekle</button></div>'
          s=s.replace(old,new,1)
          marker='function StudentModal({onClose,onSave})'
          if 'function StudentImportModal' not in s:
              component=r'''function StudentImportModal({onClose,onImport}) {
  const [file,setFile]=useState(null)
  const [rows,setRows]=useState([])
  const [error,setError]=useState('')
  const [loading,setLoading]=useState(false)
  const readText = text => {
    const lines=text.replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean)
    const out=[]
    for(const line of lines){
      const parts=line.includes(';')?line.split(';'):line.includes('\t')?line.split('\t'):line.split(',')
      const vals=parts.map(x=>x.trim()).filter(Boolean)
      if(vals.length) out.push({firstName:vals[0],lastName:vals.slice(1).join(' ')})
    }
    return out
  }
  const readFile=async f=>{
    setFile(f);setRows([]);setError('');setLoading(true)
    try{
      const lower=f.name.toLocaleLowerCase('tr')
      if(lower.endsWith('.txt')){setRows(readText(await f.text()));return}
      if(lower.endsWith('.csv')){
        const text=await f.text();
        const lines=text.replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean)
        const out=[]
        for(const line of lines){
          const vals=line.split(/[;,\t]/).map(x=>x.trim().replace(/^"|"$/g,'')).filter(Boolean)
          if(vals.length && !['ad','adı','isim','first name'].includes(vals[0].toLocaleLowerCase('tr'))) out.push({firstName:vals[0],lastName:vals.slice(1).join(' ')})
        }
        setRows(out);return
      }
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'})
      const sheet=wb.Sheets[wb.SheetNames[0]]
      const raw=XLSX.utils.sheet_to_json(sheet,{defval:''})
      const norm=x=>String(x??'').trim().toLocaleLowerCase('tr')
      const out=[]
      for(const item of raw){
        const entries=Object.entries(item).map(([k,v])=>[norm(k),String(v??'').trim()])
        const pick=names=>entries.find(([k])=>names.includes(k))?.[1]||''
        let first=pick(['ad','adı','isim','first name','firstname'])
        let last=pick(['soyad','soyadı','last name','lastname'])
        if(!first){const full=pick(['ad soyad','adı soyadı','isim soyisim','öğrenci','ogrenci']);if(full){const parts=full.split(' ').filter(Boolean);first=parts.shift()||'';last=parts.join(' ')}}
        if(first) out.push({firstName:first,lastName:last})
      }
      setRows(out)
      if(!out.length) throw new Error('Dosyada öğrenci adı bulunamadı.')
    }catch(e){setError(e instanceof Error?e.message:'Dosya okunamadı.')}finally{setLoading(false)}
  }
  return <Modal title="Toplu Öğrenci Aktar" onClose={onClose} wide>
    <p className="muted">XLS/XLSX, CSV veya TXT dosyası seç. Excel/CSV için Ad-Soyad sütunları; TXT için her satıra bir öğrenci yazabilirsin.</p>
    <label className="file-picker"><Upload size={18}/><span>{file?file.name:'Dosya seç'}</span><input type="file" accept=".xlsx,.xls,.csv,.txt,text/plain,text/csv" onChange={e=>e.target.files?.[0]&&readFile(e.target.files[0])}/></label>
    {loading&&<div className="empty">Dosya okunuyor…</div>}
    {error&&<Notice message={error}/>} 
    {!loading&&!error&&rows.length>0&&<div className="import-preview"><b>{rows.length} öğrenci bulundu</b>{rows.slice(0,10).map((r,i)=><div key={i}>{r.firstName} {r.lastName}</div>)}{rows.length>10&&<small>+ {rows.length-10} öğrenci daha</small>}</div>}
    <div className="modal-actions"><button type="button" className="secondary" onClick={onClose}>Vazgeç</button><button type="button" className="primary" disabled={!rows.length||loading} onClick={()=>onImport(rows)}>Aktar</button></div>
  </Modal>
}

'''
              s=s.replace(marker,component+marker,1)
          p.write_text(s)
          css=Path('src/index.css'); c=css.read_text()
          if '.detail-actions{' not in c:
              c += '\n.detail-actions{display:flex;gap:8px;align-items:center}\n.secondary{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.secondary.small{padding:8px 11px;font-size:13px}.file-picker{display:flex;align-items:center;gap:10px;border:1px dashed var(--border);border-radius:12px;padding:16px;cursor:pointer}.file-picker input{display:none}.import-preview{margin-top:14px;border:1px solid var(--border);border-radius:10px;padding:12px;display:grid;gap:5px}.import-preview small{color:var(--muted)}\n'
              css.write_text(c)
          PY
      - name: Test and build
        run: |
          npm test
          npm run build
      - name: Publish changes
        run: |
          rm -f .github/workflows/app-fix.yml .github/workflows/app-fix2.yml .github/workflows/app-fix3.yml .github/workflows/complete-student-import.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src/App.jsx src/index.css .github/workflows
          git commit -m 'Add multi-format student import and harden class creation'
          git push
