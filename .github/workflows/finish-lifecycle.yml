name: Finish lifecycle integration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finish:
    if: github.event.head_commit.message != 'chore: remove lifecycle workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate archive filtering and recycle-bin sync
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx'); s=p.read_text()
          old="  const visibleClasses = classes.filter(c => c.name.toLocaleLowerCase('tr').includes(search.toLocaleLowerCase('tr')))"
          new="  const activeClasses = classes.filter(c => !c.archivedAt)\n  const visibleClasses = activeClasses.filter(c => c.name.toLocaleLowerCase('tr').includes(search.toLocaleLowerCase('tr')))"
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace("{view === 'home' && <Home classes={classes}","{view === 'home' && <Home classes={activeClasses}",1)
          s=s.replace("{view === 'groups' && <Groups classes={classes}","{view === 'groups' && <Groups classes={activeClasses}",1)
          s=s.replace("{view === 'schedule' && <Schedule classes={classes}","{view === 'schedule' && <Schedule classes={activeClasses}",1)
          s=s.replace("{view === 'documents' && <Documents classes={classes}","{view === 'documents' && <Documents classes={activeClasses}",1)
          p.write_text(s)

          p=Path('src/firestoreData.js'); s=p.read_text(); s=s.replace("const COLLECTIONS = ['classes', 'groups', 'schedule', 'documents', 'studentRecords']","const COLLECTIONS = ['classes', 'groups', 'schedule', 'documents', 'studentRecords', 'trash']"); p.write_text(s)
          p=Path('src/firestoreSync.js'); s=p.read_text(); s=s.replace("  'ot-student-records': 'studentRecords',","  'ot-student-records': 'studentRecords',\n  'ot-trash': 'trash',"); s=s.replace("  studentRecords: [],\n}","  studentRecords: [],\n  trash: [],\n}"); p.write_text(s)

          p=Path('src/integrity.js'); s=p.read_text(); s=s.replace("  const studentRecords = read('ot-student-records', [])","  const studentRecords = read('ot-student-records', [])"); p.write_text(s)
          PY
      - name: Test and build
        run: |
          npm install
          npm test
          npm run build
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/finish-lifecycle.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx src/firestoreData.js src/firestoreSync.js src/integrity.js .github/workflows/finish-lifecycle.yml
          git commit -m 'feat: integrate archive filtering and recycle-bin sync'
          git push
