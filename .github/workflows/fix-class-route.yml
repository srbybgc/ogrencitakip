name: Fix class route syntax

'on':
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix route
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          s=p.read_text(encoding='utf-8')
          bad="onImportStudents={() => setModal('import-students')} / onProgram={() => setView('class-schedule')} />}"
          good="onImportStudents={() => setModal('import-students')} onProgram={() => setView('class-schedule')} />}"
          if bad not in s: raise SystemExit('bad class route pattern not found')
          p.write_text(s.replace(bad,good,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          git rm .github/workflows/fix-class-route.yml
          git commit -m 'fix: correct class schedule route syntax'
          git push
