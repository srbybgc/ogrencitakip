name: Fix student display data
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair polluted student names and display
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/App.jsx'); s=p.read_text(encoding='utf-8')
          old="""const repairImportedClasses = (value) => {\n            if (!Array.isArray(value)) return value\n            const phoneRe = /(?:\\+?90[\\s-]?)?(?:0?5\\d{2})[\\s-]?\\d{3}[\\s-]?\\d{2}[\\s-]?\\d{2}/g\n            return value.map(cls => ({...cls, students:(cls.students||[]).map(st => {\n              const first=String(st.firstName||'').trim(), last=String(st.lastName||'').trim()\n              const combined=`${first} ${last}`.replace(/\\s+/g,' ').trim(), phones=combined.match(phoneRe)||[]\n              if(!phones.length)return st\n              const cleaned=combined.replace(phoneRe,' ').replace(/\\s+/g,' ').trim(), parts=cleaned.split(' ').filter(Boolean), next={...st}\n              if(parts.length>=2){next.firstName=parts.slice(0,-1).join(' ');next.lastName=parts.at(-1)}else if(parts.length===1){next.firstName=parts[0];next.lastName=''}\n              if(!next.parentPhone)next.parentPhone=phones[0].trim()\n              return next\n            })}))\n          }"""
          new="""const repairImportedClasses = (value) => {\n            if (!Array.isArray(value)) return value\n            const phoneRe = /(?:\\+?90[\\s-]?)?(?:0?5\\d{2})[\\s-]?\\d{3}[\\s-]?\\d{2}[\\s-]?\\d{2}/g\n            const noRe = /\\b\\d{4}\\b/\n            const classRe = /^\\d+[A-ZÇĞİÖŞÜ]\\s+/i\n            return value.map(cls => ({...cls, students:(cls.students||[]).map(st => {\n              const next={...st}\n              let combined=`${String(st.firstName||'')} ${String(st.lastName||'')}`.replace(/\\s+/g,' ').trim()\n              const phones=combined.match(phoneRe)||[]\n              const noMatch=combined.match(noRe)\n              if(noMatch && !next.studentNumber) next.studentNumber=noMatch[0]\n              combined=combined.replace(phoneRe,' ').replace(classRe,'').replace(noRe,' ').replace(/\\s+/g,' ').trim()\n              const parts=combined.split(' ').filter(Boolean)\n              if(parts.length>=2){next.firstName=parts.slice(0,-1).join(' ');next.lastName=parts.at(-1)}\n              else if(parts.length===1){next.firstName=parts[0];next.lastName=''}\n              if(phones.length){if(!next.parentPhone)next.parentPhone=phones[0].trim()}\n              return next\n            })}))\n          }"""
          if old not in s: raise SystemExit('repair helper not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          q=Path('src/StudentOverlay.jsx'); t=q.read_text(encoding='utf-8')
          t=t.replace("<span style={styles.avatar}>{student.firstName?.[0]}{student.lastName?.[0] || ''}</span>","<span style={styles.avatar}>{student.firstName?.[0]}{student.lastName?.[0] || ''}</span>")
          t=t.replace("<h2 style={styles.title}>{student.firstName} {student.lastName}</h2>","<h2 style={styles.title}>{student.firstName} {student.lastName}</h2>")
          t=t.replace("infoGrid:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:10,marginTop:12}","infoGrid:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:12,marginTop:12},infoCell:{display:'flex',flexDirection:'column',gap:5,minWidth:0}")
          # Make every info cell explicit flex column so label/value never concatenate.
          t=t.replace('<div><small>Öğrenci numarası</small><b>', '<div style={styles.infoCell}><small>Öğrenci numarası</small><b>')
          t=t.replace('<div><small>Doğum tarihi</small><b>', '<div style={styles.infoCell}><small>Doğum tarihi</small><b>')
          t=t.replace('<div><small>Cinsiyet</small><b>', '<div style={styles.infoCell}><small>Cinsiyet</small><b>')
          t=t.replace('<div><small>Veli</small><b>', '<div style={styles.infoCell}><small>Veli</small><b>')
          t=t.replace('<div><small>Veli telefonu</small><b>', '<div style={styles.infoCell}><small>Veli telefonu</small><b>')
          t=t.replace('<div><small>İkinci veli</small><b>', '<div style={styles.infoCell}><small>İkinci veli</small><b>')
          t=t.replace('<div><small>İkinci veli telefonu</small><b>', '<div style={styles.infoCell}><small>İkinci veli telefonu</small><b>')
          t=t.replace("titleLine:{display:'flex',alignItems:'baseline',gap:10,flexWrap:'wrap'}","titleLine:{display:'flex',alignItems:'baseline',gap:12,flexWrap:'wrap'},studentNumber:{fontSize:16,fontWeight:800,color:'#536076',letterSpacing:'.02em',paddingRight:2}")
          # Avoid duplicate studentNumber style if already present.
          t=t.replace(",studentNumber:{fontSize:16,fontWeight:800,color:'#536076',letterSpacing:'.02em'},studentNumber:{fontSize:16,fontWeight:800,color:'#536076',letterSpacing:'.02em',paddingRight:2}",",studentNumber:{fontSize:16,fontWeight:800,color:'#536076',letterSpacing:'.02em',paddingRight:2}")
          q.write_text(t,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx src/StudentOverlay.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: separate student identity fields and repair polluted names'
          git push
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/fix-student-display.yml
          git commit -m 'chore: remove one-shot display repair workflow'
          git push
