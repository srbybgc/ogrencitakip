<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Öğrenci Takip</title>
    <style>
      #boot-status{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:#0f172a}
      #boot-status .card{max-width:620px;width:100%;padding:28px;border:1px solid #e2e8f0;border-radius:18px;background:#fff;box-shadow:0 10px 35px rgba(15,23,42,.08)}
      #boot-status h1{margin:0 0 8px;font-size:24px}
      #boot-status p{margin:8px 0;line-height:1.5;color:#475569}
      #boot-error{display:none;margin-top:18px;padding:14px;border-radius:12px;background:#fff1f2;color:#9f1239;white-space:pre-wrap;word-break:break-word;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-status">
        <div class="card">
          <h1>Öğrenci Takip</h1>
          <p>Uygulama başlatılıyor…</p>
          <div id="boot-error"></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var status = document.getElementById('boot-status');
        var errorBox = document.getElementById('boot-error');
        window.__showBootError = function (message) {
          if (!status || !errorBox) return;
          errorBox.style.display = 'block';
          errorBox.textContent = message;
        };
        window.addEventListener('error', function (event) {
          var message = event && event.error && event.error.stack
            ? event.error.stack
            : (event && event.message ? event.message : 'Bilinmeyen JavaScript hatası');
          window.__showBootError('Uygulama başlatılamadı:\n\n' + message);
        });
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var message = reason && reason.stack ? reason.stack : String(reason || 'Bilinmeyen Promise hatası');
          window.__showBootError('Uygulama başlatılamadı:\n\n' + message);
        });
        window.setTimeout(function () {
          if (status && document.getElementById('root') && document.getElementById('root').firstElementChild === status) {
            window.__showBootError('Uygulama kodu 10 saniye içinde başlatılamadı. Bu ekranı görüyorsanız JavaScript dosyası yüklenemiyor olabilir.');
          }
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
